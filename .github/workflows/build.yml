name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: |
          POM=$(find . -name pom.xml | head -n 1)
          echo "Using $POM"
          mvn -B package -f "$POM"
      - uses: actions/upload-artifact@v7
        with:
          name: AquaPotion
          path: "**/target/*.jar"
